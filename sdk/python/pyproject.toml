[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simxr-control"
version = "0.1.0"
description = "Versioned local control client for OpenXR Simulator"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["simxr_control*"]
