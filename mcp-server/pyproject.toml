[project]
name = "openxr-simulator-mcp"
version = "1.0.0"
description = "MCP server for OpenXR Simulator - provides screenshot capture and diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
]

[project.scripts]
openxr-simulator-mcp = "openxr_simulator_mcp:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["openxr_simulator_mcp.py", "debug_control.py", "legacy_control.py", "stereo_consistency.py",
                "mcp_application.py", "runtime_artifacts.py", "runtime_diagnostics.py", "artifact_workflows.py",
                "file_commands.py", "image_analysis.py", "tool_catalog.py", "tool_results.py"]
